<!DOCTYPE html>
<html>
<head>
	<title>WebCache Insert</title>
	<link rel="stylesheet" href="/style.css" type="text/css"/>
	<style>
#addfromclipboard_contents {
	max-height:50vh;
	max-width:100vw;
}
input {
	width:90vw;
}
	</style>
</head>
<body>
	<ul>
		<li>Content from<ul>
			<li><input id="enable_filepath" type="checkbox" autocomplete="off"></input><label for="enable_filepath"><b>From file</b></label><ul>
				<li><input type="text" value="/path/to/file.html" placeholder="filepath" id="input_filepath"/></li>
			</ul></li>
			<li><input id="addfromclipboard" type="checkbox" autocomplete="off"></input><label for="addfromclipboard">or <b>from clipboard</b></label><ul>
				<li>This is disabled in Firefox, but can be enabled in about:config by turning on <b>dom.events.testing.asyncClipboard</b> and <b>dom.events.asyncClipboard.readText</b></li>
			</ul></li>
			<li><input id="enable_textarea" type="checkbox" autocomplete="off"></input><label for="enable_textarea">or <b>from this</b></label>:<ul>
				<li><textarea id="textarea" disabled="" contenteditable></textarea></li>
			</ul></li>
		</ul>
		<li>Content type <select id="select_content_type" value="0">
			<option value="0">Unknown (let server guess)</option>
			<option value="1">HTML (but without '&lt;!DOCTYPE html&gt;')</option>
			<option value="2">JavaScript</option>
			<option value="3">CSS</option>
			<option value="4">JPEG</option>
			<option value="5">PNG</option>
		</select></li>
		<li><input type="text" value="www.domain.com" placeholder="domain" id="input_domain"/></li>
		<li><input type="text" placeholder="/url/path" id="input_urlpath"/></li>
		<li><input type="text" placeholder="https://www.domain.com/url/path (for automated splitting)" id="input_bothparts" autocomplete="off"/></li>
		<li><input id="guess_url_from_content" type="checkbox" autocomplete="off" checked="">or, guess URL from content</button></li>
	</ul>
	<li><button id="actionbtn">Insert</button></li>
	<a id="link_to_cached_page" class="display_none">Link to cached page</a>
	<script src="/cacheins.js" type="application/javascript"></script>
</body>
</html>
